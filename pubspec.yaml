name: flutter_comeng_project
description: "Assignment 03 — SAU Deverloper UI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  google_fonts: ^9.0.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Noto Sans Thai
      fonts:
        - asset: assets/fonts/NotoSansThai.ttf

flutter_launcher_icons:
  image_path: assets/images/img_dev2.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#1E232C"
